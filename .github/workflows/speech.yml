# Turns the clean and self-correction conversations into ASR transcripts (TTS -> phone line -> Whisper).
# Resumable: each run continues from data/asr.jsonl and data/selfcorr_asr.jsonl. A second pass fills
# conversations whose TTS request was dropped. Stop the schedule once both files are complete.
name: speech

on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:

concurrency:
  group: speech
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  speech:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -e .

      - name: Speech chain
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          for pass in 1 2; do
            timeout 150m python -m trasr.speech --source clean || true
            timeout 150m python -m trasr.speech --source selfcorr || true
          done
          echo "asr=$(wc -l < data/asr.jsonl) selfcorr_asr=$(wc -l < data/selfcorr_asr.jsonl)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-${{ github.run_id }}
          path: data/audio/
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit transcripts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/asr.jsonl data/selfcorr_asr.jsonl
          git diff --cached --quiet && exit 0
          git commit -m "data: speech transcripts $(date -u '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
